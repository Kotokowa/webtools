<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>卡里的小小世界</title>
<style>
:root{color-scheme:only light;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#ffffff;color:#243746}*{box-sizing:border-box}body{margin:0;padding:24px 16px 48px}main{max-width:680px;margin:auto}h1{font-size:22px;font-weight:600;margin:12px 0}header p{font-size:13px;color:#607788;line-height:1.7}article{background:#ffffff;border:1px solid #dce6ed;border-radius:22px;padding:24px 20px;margin:24px 0}#avatar{white-space:pre;font-family:"Courier New",monospace;font-variant-ligatures:none;line-height:1.08;margin:8px auto 30px;width:max-content}#message{white-space:pre-wrap;font-size:16px;line-height:1.95}a{color:#176b98;text-underline-offset:5px}#website{display:inline-block;margin-top:18px}details{margin-top:28px;font-size:13px;color:#526d80}summary{cursor:pointer}textarea{display:block;width:100%;height:110px;margin:16px 0;background:#f7fafc;color:#243746;border:1px solid #b5cbd9;border-radius:10px;padding:12px;resize:vertical}button{background:#66ccff;border:0;border-radius:10px;padding:10px 20px;color:#0b2534;font:inherit;cursor:pointer}#status{font-size:14px;line-height:1.7;color:#526d80;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:420px){article{padding:18px 12px}body{padding:16px 12px}}
</style></head><body><main>
<header><h1>卡里的小小世界</h1></header>
<p id="status" role="status">请打开卡片链接，或在下面粘贴链接进行备份解码。</p>
<article id="card" hidden><pre id="avatar" aria-label="由字符8组成的头像"></pre><div id="message"></div><a id="website" target="_blank" rel="noopener noreferrer">来我的网页玩</a></article>
<details id="manual"><summary>备份解码 · 粘贴卡片链接</summary><p>保存本 HTML 文件后，可以离线打开并粘贴完整链接。无需安装插件。</p><textarea id="input" spellcheck="false" aria-label="卡片完整链接或井号后的编码" placeholder="粘贴完整链接或 # 后的编码"></textarea><button id="decode" type="button">展开内容</button></details>
</main><script>
/*__BROTLI__*/
/*__CODEC__*/
function fitAvatar() {
  const available = document.getElementById('card').clientWidth - (innerWidth <= 420 ? 24 : 40);
  document.getElementById('avatar').style.fontSize = Math.min(13.5, Math.max(1, available / (Number(document.getElementById('avatar').dataset.columns || 64) * 0.601))) + 'px';
}
function show(input) {
  const status = document.getElementById('status');
  const card = document.getElementById('card');
  try {
    const data = decodeCard(input);
    const pre = document.getElementById('avatar');
    renderCardAvatar(pre, data);
    document.getElementById('message').textContent = data.message;
    const website = document.getElementById('website'); website.hidden = !data.website;
    if (data.website) website.href = data.website; else website.removeAttribute('href');
    card.hidden = false; status.textContent = ''; fitAvatar();
  } catch (error) {
    card.hidden = true; status.textContent = '未能展开：' + String(error.message || error);
    document.getElementById('manual').open = true;
  }
}
document.getElementById('decode').onclick = () => show(document.getElementById('input').value);
addEventListener('resize', fitAvatar);
addEventListener('hashchange', () => show(location.hash));
if (location.hash.length > 1) show(location.hash);
else document.getElementById('manual').open = true;
</script></body></html>
