name: Water-wave offline release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: waterwave-v2.0.0
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: offline/Dockerfile.ffmpeg
          outputs: type=local,dest=codec
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: node scripts/offline-build.cjs prepare offline-common codec
      - uses: actions/upload-artifact@v4
        with:
          name: offline-common
          path: offline-common
          retention-days: 7
  packages:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            os: windows
            arch: amd64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: offline-common
          path: offline-common
      - run: node scripts/offline-build.cjs pack offline-common package ${{ matrix.os }} ${{ matrix.arch }}
        env:
          WATERWAVE_SIGNING_KEY: ${{ secrets.WATERWAVE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: python tests/focal-fixture.py
      - run: node tests/offline-smoke.cjs package
      - run: python scripts/offline-zip.py package waterwave-${{ matrix.os }}-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: waterwave-${{ matrix.os }}-${{ matrix.arch }}
          path: waterwave-*.zip
          retention-days: 7
  release:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: waterwave-*
          path: packages
          merge-multiple: true
      - run: sha256sum packages/*.zip > packages/SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" packages/* --target "$GITHUB_SHA" --title "Water Wave Lab $TAG" --notes "Standalone offline water-wave tool. Original code: MIT; dependency licenses and decoder sources are included."
